{% extends "base.html" %}
{% block nav_register %}active{% endblock %}
{% block page_title %}Register Student{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card panel">
      <div class="card-header"><i class="bi bi-person-plus"></i> New Student Registration</div>
      <div class="card-body">
        <form method="post" enctype="multipart/form-data">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">Student ID <span class="text-danger">*</span></label>
              <input name="student_id" class="form-control" placeholder="e.g. FA24-BCS-001" required>
              <div class="form-text">Letters, numbers, dash and underscore only.</div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">Full Name <span class="text-danger">*</span></label>
              <input name="name" class="form-control" placeholder="e.g. Ali Khan" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">Roll No</label>
              <input name="roll_no" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">Class / Section</label>
              <input name="class_name" class="form-control" placeholder="e.g. BSCS-6A">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">Email</label>
              <input name="email" type="email" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">Phone</label>
              <input name="phone" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label small fw-semibold">Profile Photo (optional)</label>
              <input name="photo" type="file" accept="image/*" class="form-control">
            </div>
          </div>
          <button class="btn btn-primary px-4"><i class="bi bi-save"></i> Register &amp; Continue to Face Capture</button>
          <a href="{{ url_for('students') }}" class="btn btn-link">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
